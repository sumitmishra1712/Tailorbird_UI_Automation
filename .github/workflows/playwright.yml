name: Playwright Tests

run-name: >
  ${{ github.event_name == 'workflow_dispatch'
      && format('Playwright - {0}', inputs.suite)
      || 'Playwright - regression (push/PR)' }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      suite:
        required: false
        default: regression
        type: choice
        options:
          - Login
          - sanity
          - regression
          - property
          - projectAndJob
          - bids
          - contract
          - budget
          - changeOrderAndinvoice
          - approval
      notion_ticket_id:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Load .env
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
          fi

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Record run start
        run: echo "RUN_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run login first
        id: login
        continue-on-error: true
        run: |
          if [ "${{ inputs.suite }}" = "Login" ]; then
            npx playwright test --grep "TC01" --workers=1
          else
            npx playwright test --grep @login --workers=1
          fi

      - name: Run mandatory tests
        id: mandatory
        if: ${{ inputs.suite == 'regression' || inputs.suite == 'changeOrderAndinvoice' }}
        continue-on-error: true
        run: npx playwright test --grep @mandatory --workers=1

      - name: Run suite
        id: suite
        if: always()
        continue-on-error: true
        run: |
          SUITE="${{ inputs.suite }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Push/PR: running regression (mandatory serial + invert parallel)"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "Login" ]; then
            echo "Login: TC01 only (already run)" | tee test-output.txt
            exit 0
          elif [ "$SUITE" = "sanity" ]; then
            echo "sanity: @sanity only, serial"
            npx playwright test --grep @sanity --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "regression" ]; then
            echo "regression: mandatory (serial) already run, now invert mandatory (parallel)"
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "property" ]; then
            echo "property: @property parallel"
            npx playwright test --grep @property --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "projectAndJob" ]; then
            echo "projectAndJob: @projectAndJob parallel"
            npx playwright test --grep @projectAndJob --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "bids" ]; then
            echo "bids: @bids serial"
            npx playwright test --grep @bids --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "contract" ]; then
            echo "contract: @contract serial"
            npx playwright test --grep @contract --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "budget" ]; then
            echo "budget: @budget parallel"
            npx playwright test --grep @budget --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "changeOrderAndinvoice" ]; then
            echo "changeOrderAndinvoice: mandatory (serial) already run, now @changeOrderAndinvoice parallel"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep @changeOrderAndinvoice --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "approval" ]; then
            echo "approval: @approval parallel"
            npx playwright test --grep @approval --workers=4 2>&1 | tee test-output.txt
          else
            echo "Unknown suite: $SUITE, running full regression"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: playwright-report/

      - name: Zip report for Notion
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.notion_ticket_id != '' }}
        run: |
          zip -r playwright-report.zip playwright-report/
          echo "Report zipped: $(ls -la playwright-report.zip)"

      - name: Create release and upload report zip
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.notion_ticket_id != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: report-run-${{ github.run_id }}
          name: Playwright Report (Run #${{ github.run_number }})
          draft: false
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          files: playwright-report.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Notion with report zip attachment
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.notion_ticket_id != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ZIP_URL: https://github.com/${{ github.repository }}/releases/download/report-run-${{ github.run_id }}/playwright-report.zip
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/report-run-${{ github.run_id }}
        run: |
          echo "=== Fetching page properties ==="
          PAGE_DATA=$(curl -s "https://api.notion.com/v1/pages/${{ inputs.notion_ticket_id }}" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28")
          echo "Available properties:"
          echo "$PAGE_DATA" | jq '[.properties | keys[]]' 2>/dev/null

          echo ""
          echo "=== Updating Notion ticket: Test Report (Actions run URL), CI Trigger ==="
          PATCH_JSON=$(jq -n \
            --arg run_url "$RUN_URL" \
            '{
              properties: {
                "Test Report": { url: $run_url },
                "CI Trigger": { select: { name: "Reported" } }
              }
            }')
          RESULT=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.notion.com/v1/pages/${{ inputs.notion_ticket_id }}" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$PATCH_JSON")
          HTTP_CODE=$(echo "$RESULT" | tail -n 1)
          echo "Notion PATCH properties HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Notion PATCH response:"
            echo "$RESULT" | head -n -1 | jq '.' 2>/dev/null
          fi

          echo ""
          echo "=== Appending report zip block to page content ==="
          BLOCK_JSON=$(jq -n \
            --arg zip_url "$ZIP_URL" \
            --arg run "Run #${{ github.run_number }}" \
            '{children: [{object: "block", type: "file", file: {type: "external", external: {url: $zip_url}, caption: [{type: "text", text: {content: ("Playwright Report (" + $run + ") - Download ZIP")}}]}}]}')
          BLOCK_RESULT=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.notion.com/v1/blocks/${{ inputs.notion_ticket_id }}/children" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$BLOCK_JSON")
          BLOCK_HTTP=$(echo "$BLOCK_RESULT" | tail -n 1)
          echo "Notion append file block HTTP status: $BLOCK_HTTP"
          if [ "$BLOCK_HTTP" != "200" ]; then
            echo "Notion block append response:"
            echo "$BLOCK_RESULT" | head -n -1 | jq '.' 2>/dev/null
          else
            echo "Report ZIP attached to Notion ticket successfully"
          fi

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          REPORT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS="${{ steps.suite.outcome }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Passed"
          else
            EMOJI="❌"
            STATUS_TEXT="Failed"
          fi
          DURATION=$(($(date +%s) - RUN_START))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))
          if [ $DURATION_MIN -gt 0 ]; then
            DURATION_STR="${DURATION_MIN}m ${DURATION_SEC}s"
          else
            DURATION_STR="${DURATION_SEC}s"
          fi
          PASSED=$(grep -oE '[0-9]+ passed' test-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          [ -z "$PASSED" ] && PASSED=0
          [ -z "$FAILED" ] && FAILED=0
          TOTAL=$((PASSED + FAILED))
          [ $TOTAL -eq 0 ] && TOTAL="—"
          SUITE="${{ inputs.suite || 'regression' }}"
          [ -z "$SUITE" ] && SUITE="regression"
          PAYLOAD=$(jq -n \
            --arg emoji "$EMOJI" \
            --arg status "$STATUS_TEXT" \
            --arg suite "$SUITE" \
            --arg total "$TOTAL" \
            --arg failed "$FAILED" \
            --arg duration "$DURATION_STR" \
            --arg url "$REPORT_URL" \
            '{
              blocks: [
                { type: "header", text: { type: "plain_text", text: ($emoji + " Playwright Tests - " + $status), emoji: true } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: ("*Suite:*\n" + $suite) },
                  { type: "mrkdwn", text: ("*Status:*\n" + $emoji + " " + $status) },
                  { type: "mrkdwn", text: ("*📊 Total:*\n" + $total) },
                  { type: "mrkdwn", text: ("*❌ Failed:*\n" + $failed) },
                  { type: "mrkdwn", text: ("*🕒 Duration:*\n" + $duration) },
                  { type: "mrkdwn", text: ("*📎 Report:*\n<" + $url + "|View Run>") }
                ]}
              ]
            }')
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          fi

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
