name: Playwright Tests

run-name: >
  ${{ github.event_name == 'workflow_dispatch'
      && format('Playwright - {0}', inputs.suite)
      || 'Playwright - regression (push/PR)' }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      suite:
        required: false
        default: regression
        type: choice
        options:
          - Login
          - sanity
          - regression
          - property
          - projectAndJob
          - bids
          - contract
          - budget
          - changeOrderAndinvoice
          - approval

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Load .env
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
          fi

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run login first
        id: login
        continue-on-error: true
        run: |
          if [ "${{ inputs.suite }}" = "Login" ]; then
            npx playwright test --grep "TC01" --workers=1
          else
            npx playwright test --grep @login --workers=1
          fi

      - name: Run mandatory tests
        id: mandatory
        if: ${{ inputs.suite == 'regression' || inputs.suite == 'changeOrderAndinvoice' }}
        continue-on-error: true
        run: npx playwright test --grep @mandatory --workers=1

      - name: Record run start
        run: echo "RUN_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run suite
        id: suite
        if: always()
        continue-on-error: true
        run: |
          SUITE="${{ inputs.suite }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Push/PR: running regression (mandatory serial + invert parallel)"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "Login" ]; then
            echo "Login: TC01 only (already run)" | tee test-output.txt
            exit 0
          elif [ "$SUITE" = "sanity" ]; then
            echo "sanity: @sanity only, serial"
            npx playwright test --grep @sanity --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "regression" ]; then
            echo "regression: mandatory (serial) already run, now invert mandatory (parallel)"
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "property" ]; then
            echo "property: @property parallel"
            npx playwright test --grep @property --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "projectAndJob" ]; then
            echo "projectAndJob: @projectAndJob parallel"
            npx playwright test --grep @projectAndJob --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "bids" ]; then
            echo "bids: @bids serial"
            npx playwright test --grep @bids --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "contract" ]; then
            echo "contract: @contract serial"
            npx playwright test --grep @contract --workers=1 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "budget" ]; then
            echo "budget: @budget parallel"
            npx playwright test --grep @budget --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "changeOrderAndinvoice" ]; then
            echo "changeOrderAndinvoice: mandatory (serial) already run, now @changeOrderAndinvoice parallel"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep @changeOrderAndinvoice --workers=4 2>&1 | tee test-output.txt
          elif [ "$SUITE" = "approval" ]; then
            echo "approval: @approval parallel"
            npx playwright test --grep @approval --workers=4 2>&1 | tee test-output.txt
          else
            echo "Unknown suite: $SUITE, running full regression"
            npx playwright test --grep @mandatory --workers=1 2>&1 | tee -a test-output.txt || true
            npx playwright test --grep-invert @mandatory --workers=4 2>&1 | tee test-output.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: playwright-report/

      - name: Notify Slack
        if: always() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SLACK_WEBHOOK=$(echo "$SLACK_WEBHOOK" | tr -d '\n\r' | xargs)
          REPORT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS="${{ steps.suite.outcome }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Passed"
          else
            EMOJI="❌"
            STATUS_TEXT="Failed"
          fi
          RUN_START=${RUN_START:-0}
          NOW=$(date +%s)
          DURATION=$((NOW - RUN_START))
          if [ "$RUN_START" = "0" ] || [ $DURATION -lt 0 ] || [ $DURATION -gt 86400 ]; then
            DURATION_STR="N/A"
          else
            DURATION_MIN=$((DURATION / 60))
            DURATION_SEC=$((DURATION % 60))
            if [ $DURATION_MIN -gt 0 ]; then
              DURATION_STR="${DURATION_MIN}m ${DURATION_SEC}s"
            else
              DURATION_STR="${DURATION_SEC}s"
            fi
          fi
          PASSED=$(grep -oE '[0-9]+ passed' test-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          [ -z "$PASSED" ] && PASSED=0 || true
          [ -z "$FAILED" ] && FAILED=0 || true
          TOTAL=$((PASSED + FAILED))
          [ $TOTAL -eq 0 ] && TOTAL="—" || true
          SUITE="${{ inputs.suite || 'regression' }}"
          [ -z "$SUITE" ] && SUITE="regression" || true
          PAYLOAD=$(jq -n \
            --arg emoji "$EMOJI" \
            --arg status "$STATUS_TEXT" \
            --arg suite "$SUITE" \
            --arg total "$TOTAL" \
            --arg failed "$FAILED" \
            --arg duration "$DURATION_STR" \
            --arg url "$REPORT_URL" \
            '{
              blocks: [
                { type: "header", text: { type: "plain_text", text: ($emoji + " Playwright Tests - " + $status), emoji: true } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: ("*Suite:*\n" + $suite) },
                  { type: "mrkdwn", text: ("*Status:*\n" + $emoji + " " + $status) },
                  { type: "mrkdwn", text: ("*📊 Total:*\n" + $total) },
                  { type: "mrkdwn", text: ("*❌ Failed:*\n" + $failed) },
                  { type: "mrkdwn", text: ("*🕒 Duration:*\n" + $duration) },
                  { type: "mrkdwn", text: ("*📎 Report:*\n<" + $url + "|View Run>") }
                ]}
              ]
            }')
          if [ -n "$SLACK_WEBHOOK" ]; then
            echo "Posting to Slack... (webhook URL length: ${#SLACK_WEBHOOK} chars)"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            echo "Slack API response: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Slack error body: $(echo "$RESPONSE" | head -n -1)"
            fi
          else
            echo "SLACK_WEBHOOK not set - skipping notification"
          fi

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
