name: Playwright Tests

run-name: >
  ${{ github.event_name == 'workflow_dispatch'
      && format('Playwright - {0}', inputs.suite)
      || 'Playwright - RegressionRun (push/PR)' }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      suite:
        required: false
        default: RegressionRun
        type: choice
        options:
          - RegressionRun
          - SanityRun
          - Component_Login
          - Component_Menu
          - Component_Organization
          - Component_Property
          - Component_Project
          - Component_Job
          - Component_Category
          - Component_Invoice
          - Component_ChangeOrder
          - Component_Approval
          - Component_Budget
      notion_ticket_id:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Load .env
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
          fi

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run mandatory tests
        id: mandatory
        continue-on-error: true
        run: npx playwright test --grep @mandatory --workers=1

      - name: Run suite
        id: suite
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run "${{ inputs.suite }}" -- --grep-invert @mandatory --workers=4
          else
            npm run RegressionRun -- --grep-invert @mandatory --workers=4
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: playwright-report/

      - name: Update Notion with report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.notion_ticket_id != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ steps.mandatory.conclusion == 'success' && steps.suite.conclusion == 'success' && 'Passed' || 'Failed' }}
        run: |
          echo "=== Fetching page properties to verify available property names ==="
          PAGE_DATA=$(curl -s "https://api.notion.com/v1/pages/${{ inputs.notion_ticket_id }}" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28")
          echo "Available properties:"
          echo "$PAGE_DATA" | jq '[.properties | keys[]]' 2>/dev/null

          echo ""
          echo "=== Updating Notion ticket with report URL: $RUN_URL ==="
          RESULT=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.notion.com/v1/pages/${{ inputs.notion_ticket_id }}" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"properties\": {
                \"Test Report\": {
                  \"url\": \"$RUN_URL\"
                },
                \"CI Trigger\": {
                  \"select\": { \"name\": \"Reported\" }
                }
              }
            }")
          HTTP_CODE=$(echo "$RESULT" | tail -n 1)
          echo "Notion PATCH HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Notion error response:"
            echo "$RESULT" | head -n -1 | jq '.' 2>/dev/null
          else
            echo "Notion ticket updated successfully"
          fi

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
