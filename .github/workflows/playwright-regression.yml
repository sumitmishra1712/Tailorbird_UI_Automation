name: Playwright Regression Tests

run-name: Playwright - regression

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      report_exists: ${{ steps.report-check.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright project dependencies
        working-directory: Playwright/Tailorbird_UI_Automation
        run: npm ci 2>/dev/null || npm install

      - name: Install Playwright browsers
        working-directory: Playwright/Tailorbird_UI_Automation
        run: npm exec playwright install chromium --with-deps

      - name: Load .env
        run: |
          if [ -f Playwright/Tailorbird_UI_Automation/.env ]; then
            cat Playwright/Tailorbird_UI_Automation/.env >> $GITHUB_ENV
          fi

      - name: Run login to establish session
        working-directory: Playwright/Tailorbird_UI_Automation
        continue-on-error: true
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          BASE_URL: ${{ vars.BASE_URL }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
        run: |
          echo "Running @login to establish session"
          npx playwright test --grep "@login" --workers=1 --reporter=line,html || true

      - name: Run mandatory tests (serial)
        working-directory: Playwright/Tailorbird_UI_Automation
        continue-on-error: true
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          BASE_URL: ${{ vars.BASE_URL }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
        run: |
          echo "Running mandatory tests"
          npm run Test:mandatory -- --reporter=line,html || true

      - name: Run remaining regression tests (parallel)
        working-directory: Playwright/Tailorbird_UI_Automation
        continue-on-error: true
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
        run: |
          echo "Running remaining regression tests in parallel"
          export PLAYWRIGHT_WORKERS=4
          npx playwright test --grep-invert "@mandatory" --workers=4 --fully-parallel --reporter=line,html || true

      - name: Check if report was generated
        id: report-check
        if: always()
        run: |
          if [ -f Playwright/Tailorbird_UI_Automation/playwright-report/index.html ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: Playwright/Tailorbird_UI_Automation/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload report for GitHub Pages
        if: always() && steps.report-check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Playwright/Tailorbird_UI_Automation/playwright-report/

  deploy:
    needs: test
    if: always() && needs.test.outputs.report_exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy